<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08080f" />
    <meta name="description" content="DTS Mail: AI-first email for every domain you host." />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>DTS Mail</title>
    <style>
      html, body { height: 100%; margin: 0; background: #08080f; color: #e9e9f1;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      #root { height: 100%; }
      .dts-boot { position: relative; height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
      .dts-boot-card { max-width: 380px; text-align: center; }
      .dts-boot-card img { width: 48px; height: 48px; margin-bottom: 16px; }
      .dts-boot-card h1 { font-size: 18px; font-weight: 600; margin: 0 0 8px; }
      .dts-boot-card p { font-size: 13.5px; line-height: 1.5; color: #a3a3b8; margin: 0 0 16px; }
      .dts-boot-card button { font: inherit; font-size: 13.5px; font-weight: 600; padding: 8px 18px; border-radius: 10px;
        border: 0; background: #e9e9f1; color: #08080f; cursor: pointer; }
      .dts-spinner { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #2a2a3a; border-top-color: #00d4ff;
        animation: dts-spin 0.8s linear infinite; margin: 0 auto; }
      @keyframes dts-spin { to { transform: rotate(360deg); } }
      .dts-credit { position: absolute; left: 0; right: 0; bottom: 16px; text-align: center; font-size: 11px;
        color: #6b6b80; text-decoration: none; }
      .dts-credit:hover { color: #a3a3b8; }
    </style>
  </head>
  <body>
    <!-- The app renders into #root and replaces the loader's status text when it starts. -->
    <div id="root"><div class="dts-boot"><div class="dts-spinner" aria-label="Loading DTS Mail"></div><a class="dts-credit" href="https://chuckgiddens.com" target="_blank" rel="noopener noreferrer">Powered by DTS LLS</a></div></div>
    <script src="/loader.js"></script>
  </body>
</html>
